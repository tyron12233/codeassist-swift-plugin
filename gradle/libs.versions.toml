# The versions CodeAssist itself builds with. Kotlin and Compose must match the IDE's: a plugin is loaded into the
# IDE's process and links against the Kotlin stdlib, coroutines and Compose the IDE bundles.
[versions]
# The CodeAssist release whose plugin SPI this compiles against, served by JitPack (SPI 3.9.0).
codeassistSpi = "v3.50.0"
kotlin = "2.4.20"
agp = "9.2.1"
coroutines = "1.11.0"
junit = "5.11.4"
androidxCompose = "1.11.2"
androidxComposeMaterial3 = "1.4.0"

[libraries]
codeassist-plugin-bom = { module = "com.github.tyron12233.CodeAssist:plugin-bom", version.ref = "codeassistSpi" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.8.1" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "androidxCompose" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidxCompose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidxCompose" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidxComposeMaterial3" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
